<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sunny Fund Review｜基金管理 200 題</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#e8ecf8;background:#101827}*{box-sizing:border-box}body{margin:0}header{background:#172238;border-bottom:1px solid #344159;padding:22px 16px}main{max-width:850px;margin:24px auto;padding:0 16px}h1{margin:0;font-size:27px}p{color:#bac7da}button,select,input{font:inherit}button{background:#273a59;color:#f5f8ff;border:1px solid #485c7a;border-radius:12px;padding:12px 16px;cursor:pointer}button:hover{background:#385074}button:disabled{opacity:.5}button.primary{background:#4d65ed;border-color:#7385ff}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}.card{background:#192439;border:1px solid #34435e;border-radius:17px;padding:20px;margin-bottom:14px}.question{font-size:20px;line-height:1.7;white-space:pre-wrap}.choice{display:block;text-align:left;width:100%;margin:9px 0;line-height:1.6}.choice.correct{background:#176f55}.choice.wrong{background:#953747}.hint{margin-top:14px;padding:12px;border-radius:10px;background:#283951}.meta{display:flex;justify-content:space-between;gap:10px;color:#bdc9d8;font-size:14px}.stats{display:flex;gap:16px;flex-wrap:wrap;margin:20px 0}#status{font-weight:600}a{color:#aebcff}select,input{color:#fff;background:#243450;border:1px solid #52617a;border-radius:10px;padding:10px}footer{text-align:center;color:#a9b7cc;padding:40px 10px}.hidden{display:none}#list .card{cursor:pointer}</style></head>
<body><header><main style="margin:0 auto"><h1>📚 Sunny Fund Review</h1><p>空大《基金管理》200 題文字複習｜以課本與老師教材答案為準</p></main></header>
<main><div class="stats"><span id="total">題庫讀取中…</span><span id="progress"></span></div>
<div class="controls"><select id="chapter"><option value="all">全部章節</option></select><button id="start" class="primary">開始章節練習</button><button id="random">隨機 20 題</button><button id="wrong">錯題重練</button><button id="favorite">收藏練習</button><button id="browse">瀏覽題庫</button></div>
<section id="quiz" class="hidden"><div class="meta"><span id="pos"></span><span id="score"></span></div><div class="card"><div class="controls"><button id="star">☆ 收藏</button><button id="showSource">顯示原始圖片</button></div><div id="question" class="question"></div><div id="choices"></div><div id="feedback" class="hidden hint"></div><div id="source" class="hidden"></div></div><div class="controls"><button id="prev">上一題</button><button id="next" class="primary">下一題</button></div></section>
<section id="list" class="hidden"></section><section id="welcome" class="card"><h2>準備開始複習了嗎？</h2><p>支援即時判分、錯題本、收藏、章節篩選及隨機測驗。學習紀錄只存在這台裝置的瀏覽器。</p></section></main>
<footer>Sunny Fund Review · 教材答案優先 · 非官方測驗網站</footer>
<script>
const $=id=>document.getElementById(id);let bank=[],round=[],index=0,answers={},mode='all',wrongSet=new Set(JSON.parse(localStorage.getItem('sunny-fund-wrong')||'[]')),favorites=new Set(JSON.parse(localStorage.getItem('sunny-fund-favorites')||'[]'));
const save=()=>{localStorage.setItem('sunny-fund-wrong',JSON.stringify([...wrongSet]));localStorage.setItem('sunny-fund-favorites',JSON.stringify([...favorites]));updateStats()};
function updateStats(){$('total').textContent='共 '+bank.length+' 題';$('progress').textContent='錯題 '+wrongSet.size+'｜收藏 '+favorites.size}
const label=q=>'第 '+q.id+' 題 · '+q.chapter;const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function begin(arr){if(!arr.length){alert('目前沒有符合條件的題目');return}round=arr.slice();index=0;answers={};$('welcome').classList.add('hidden');$('list').classList.add('hidden');$('quiz').classList.remove('hidden');render();window.scrollTo(0,0)}
function render(){let q=round[index],a=answers[q.id];$('pos').textContent=label(q)+'｜'+(index+1)+' / '+round.length;$('score').textContent='答對 '+Object.values(answers).filter(x=>x.right).length+' / '+Object.keys(answers).length;$('question').textContent=q.text;$('star').textContent=favorites.has(q.id)?'★ 已收藏':'☆ 收藏';$('feedback').classList.add('hidden');$('source').classList.add('hidden');$('source').innerHTML='';$('choices').innerHTML='';q.options.forEach((o,i)=>{let b=document.createElement('button');b.className='choice';b.textContent='ABCD'[i]+'．'+o;if(a){b.disabled=true;if('ABCD'[i]===q.answer)b.classList.add('correct');else if('ABCD'[i]===a.choice)b.classList.add('wrong')}b.onclick=()=>choose('ABCD'[i]);$('choices').appendChild(b)});if(a){$('feedback').textContent=a.right?'✓ 答對了':'✗ 答錯了，教材答案：'+q.answer;$('feedback').classList.remove('hidden')} $('prev').disabled=index===0;$('next').textContent=index===round.length-1?'完成測驗':'下一題'}
function choose(choice){let q=round[index];if(answers[q.id])return;answers[q.id]={choice,right:choice===q.answer};if(choice===q.answer)wrongSet.delete(q.id);else wrongSet.add(q.id);save();render()}
$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<round.length-1){index++;render()}else{let n=Object.values(answers).filter(x=>x.right).length;alert('本次完成 '+Object.keys(answers).length+' 題，答對 '+n+' 題！');$('quiz').classList.add('hidden');$('welcome').classList.remove('hidden')}};
$('star').onclick=()=>{let id=round[index].id;favorites.has(id)?favorites.delete(id):favorites.add(id);save();render()};
$('showSource').onclick=()=>{let q=round[index],p=$('source');p.classList.toggle('hidden');if(!p.innerHTML)p.innerHTML='<p>原始教材圖片（若此版本包含圖片）</p><img style="width:100%;border-radius:12px" alt="教材題目原圖" src="assets/q'+String(q.id).padStart(3,'0')+'.webp" onerror="this.replaceWith(document.createTextNode(\'此版本尚未上傳原圖\'))">'};
function selected(){let ch=$('chapter').value;return bank.filter(q=>ch==='all'||q.chapter===ch)}
$('start').onclick=()=>begin(selected());$('random').onclick=()=>begin(selected().sort(()=>Math.random()-.5).slice(0,20));$('wrong').onclick=()=>begin(selected().filter(q=>wrongSet.has(q.id)));$('favorite').onclick=()=>begin(selected().filter(q=>favorites.has(q.id)));
$('browse').onclick=()=>{$('quiz').classList.add('hidden');$('welcome').classList.add('hidden');$('list').classList.remove('hidden');$('list').innerHTML='';selected().forEach(q=>{let c=document.createElement('article');c.className='card';c.innerHTML='<div class="meta">'+label(q)+'</div><p>'+escapeHtml(q.text)+'</p><p>'+q.options.map((o,i)=>'ABCD'[i]+'．'+escapeHtml(o)).join('<br>')+'</p><p>教材答案：<strong>'+q.answer+'</strong></p>';c.onclick=()=>begin([q]);$('list').appendChild(c)})};
fetch('questions.json').then(r=>{if(!r.ok)throw Error('題庫尚未上傳');return r.json()}).then(d=>{bank=d;let ch=[...new Set(bank.map(q=>q.chapter))];for(let c of ch){let e=document.createElement('option');e.value=c;e.textContent=c;$('chapter').appendChild(e)}updateStats()}).catch(e=>{$('total').textContent='題庫載入失敗';$('welcome').innerHTML='<p>無法載入 questions.json：'+escapeHtml(e.message)+'</p>'});
</script></body></html>
