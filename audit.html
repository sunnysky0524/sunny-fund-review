<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>基金管理 · 原圖校對工具</title><style>body{margin:0;background:#f4f7fb;color:#18253b;font:16px/1.6 system-ui,"Noto Sans TC",sans-serif}header{padding:15px 5vw;background:#182b47;color:white}main{max-width:1200px;margin:auto;padding:18px}nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}button,select,input,textarea{font:inherit;padding:8px;border:1px solid #cad4df;border-radius:9px}button{cursor:pointer;background:white}button.primary{background:#008a84;color:white;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:white;border:1px solid #dbe3ed;border-radius:15px;padding:16px}.panel img{width:100%;height:auto}label{display:block;font-weight:650;margin:12px 0 4px}textarea{width:100%;min-height:75px;box-sizing:border-box}input[type=text]{width:100%;box-sizing:border-box}.options{display:grid;gap:8px}.options label{margin:0}.meta{color:#6a7585;font-size:13px}.status{background:#fff5d8;padding:8px 12px;border-radius:10px;margin-bottom:14px}.small{font-size:13px;color:#63758b}#jump{width:90px}@media(max-width:800px){.grid{grid-template-columns:1fr}} </style><header><strong>Sunny Fund Review · 原圖逐題校對</strong> <a style="color:#d5f7ec;float:right" href="index.html">返回測驗</a></header><main><p>左側原始題圖，右側是網站文字。修正後按「儲存本題」，全部修改完成後按「匯出修訂題庫 JSON」。本工具不會自動更改伺服器檔案。</p><nav><label for="filter">篩選</label><select id="filter"><option value="all">全部</option><option value="pending">待核對</option><option value="done">已核對</option></select><label for="jump">題號</label><input id="jump" type="number" min="1" max="200"><button id="go">跳轉</button><button id="prev">← 上一題</button><button id="next">下一題 →</button><button class="primary" id="export">匯出修訂題庫 JSON</button></nav><div id="progress" class="status"></div><div class="grid"><div class="panel"><h2 id="heading">原始圖片</h2><img id="original" alt="原始題目圖片"></div><div class="panel"><div id="meta" class="meta"></div><label for="question">題幹</label><textarea id="question"></textarea><div id="options" class="options"></div><label for="answer">教材答案</label><select id="answer"><option>A</option><option>B</option><option>C</option><option>D</option></select><label><input type="checkbox" id="checked"> 我已對照原圖確認文字與選項</label><label for="note">校對備註</label><textarea id="note" placeholder="例如：圖片模糊、答案有爭議、需要再查教材" style="min-height:55px"></textarea><p><button class="primary" id="save">儲存本題並前往下一題</button></p><div class="small">修改紀錄暫存在此瀏覽器；換裝置前請匯出 JSON 備份。</div></div></div></main><script>
let data=[],current=1,edits={};const $=id=>document.getElementById(id),KEY='sunny-fund-review-audit-v2';try{edits=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};
const entry=id=>({...data[id-1],...(edits[id]||{})});function isChecked(q){return !!(q.audit_verified||q.verified_from_image)}function count(){return data.filter(q=>isChecked(entry(q.id))).length}
function render(){const q=entry(current);$('jump').value=current;$('heading').textContent='原圖 · 第 '+current+' 題';$('original').src=q.image;$('meta').textContent=q.chapter+' · 原始校對狀態：'+(q.review_status||'未標記');$('question').value=q.text;$('options').innerHTML='';q.options.forEach((o,i)=>{const label=document.createElement('label');label.textContent='ABCD'[i]+' 選項';const input=document.createElement('textarea');input.rows=2;input.value=o;input.dataset.option=i;label.append(input);$('options').append(label)});$('answer').value=q.answer;$('checked').checked=!!(q.audit_verified||q.verified_from_image);$('note').value=q.audit_note||'';$('progress').textContent='人工確認 '+count()+' / 200 題 · 目前第 '+current+' 題'}
function save(){const old=entry(current);edits[current]={text:$('question').value.trim(),options:[...document.querySelectorAll('[data-option]')].map(x=>x.value.trim()),answer:$('answer').value,audit_verified:$('checked').checked,audit_note:$('note').value.trim(),review_status:$('checked').checked?'已使用校對工具對照原圖確認':old.review_status};localStorage.setItem(KEY,JSON.stringify(edits));$('progress').textContent='已儲存第 '+current+' 題 · 人工確認 '+count()+' / 200'}
function navigate(n){if(data.length){save()}current=Math.min(200,Math.max(1,n));render()}$('save').onclick=()=>{navigate(current+1)};$('prev').onclick=()=>navigate(current-1);$('next').onclick=()=>navigate(current+1);$('go').onclick=()=>navigate(Number($('jump').value)||1);$('filter').onchange=()=>{const want=$('filter').value;if(want==='all')return navigate(1);const hit=data.find(q=>want==='done'?isChecked(entry(q.id)):!isChecked(entry(q.id)));if(hit)navigate(hit.id);else alert('這個篩選目前沒有題目')};$('export').onclick=()=>{save();const out=data.map(q=>({...q,...(edits[q.id]||{})}));const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='sunny-fund-review-200-audited.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};fetch('questions.json').then(r=>r.json()).then(q=>{data=q;render()}).catch(e=>{$('progress').textContent='載入失敗，請透過 GitHub Pages 或本機 HTTP 伺服器開啟。'+e});
</script></html>
